// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    def localData = System.getenv('LOCALAPPDATA')
    if (localData) {
        // OneDrive placeholders are not regular files to Gradle's snapshotter.
        def checkout = rootProject.projectDir.parentFile.absolutePath
        def cacheId = java.security.MessageDigest.getInstance('SHA-256')
            .digest(checkout.getBytes('UTF-8')).encodeHex().toString().substring(0, 12)
        layout.buildDirectory.set(new File(localData, "JankoMuzykant/android-build/${cacheId}/${project.name}"))
    }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
